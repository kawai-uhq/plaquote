name: Build Plaquote APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Rename APK for updater
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Plaquote.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Plaquote-debug-apk
          path: app/build/outputs/apk/debug/Plaquote.apk
