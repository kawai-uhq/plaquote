name: Build Plaquote APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/plaquote-release.jks"
            echo "Signing key decoded."
          else
            echo "No signing key found."
          fi

      - name: Build APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/plaquote-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew

          if [ -f "$KEYSTORE_FILE" ] && [ -s "$KEYSTORE_FILE" ]; then
            echo "Building signed release APK..."
            ./gradlew --no-daemon clean assembleRelease
            APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          else
            echo "Building debug APK..."
            ./gradlew --no-daemon clean assembleDebug
            APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          fi

          mkdir -p release
          cp "$APK" release/Plaquote.apk
          echo "APK ready: release/Plaquote.apk"
          ls -lh release/Plaquote.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Plaquote-apk
          path: release/Plaquote.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="1.3.${{ github.run_number }}"
          echo "Creating release v${VERSION}"

          gh release create "v${VERSION}" \
            release/Plaquote.apk \
            --title "Plaquote ${VERSION}" \
            --generate-notes \
            --latest
