name: Build Plaquote APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      HAS_SIGNING_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout Plaquote
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Decode signing key
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/plaquote-release.jks"

      - name: Build release APK
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/plaquote-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Build debug APK
        if: env.HAS_SIGNING_KEY != 'true'
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Prepare APK
        run: |
          echo "APK files produced by Gradle:"
          find app/build/outputs/apk -type f -name "*.apk" -print

          APK=$(find app/build/outputs/apk/release -type f -name "*.apk" 2>/dev/null | head -n 1)

          if [ -z "$APK" ]; then
            APK=$(find app/build/outputs/apk/debug -type f -name "*.apk" 2>/dev/null | head -n 1)
          fi

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was produced."
            exit 1
          fi

          echo "Using APK: $APK"
          cp "$APK" app/build/outputs/apk/Plaquote.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Plaquote-apk
          path: app/build/outputs/apk/Plaquote.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/Plaquote.apk
          generate_release_notes: true
